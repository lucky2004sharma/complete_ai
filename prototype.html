<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Social Media Resizer — Aurora Precision</title>
  
  <style id="prototype-theme">
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap');

    :root {
      color-scheme: dark;
      --night: #080814;
      --glass: rgba(27,29,63,.76);
      --cyan: #64e4f4;
      --violet: #9f83ff;
      --copper: #d47d54;
      --paper: #f5eee3;
      --bg: #080814;
      --panel: #17172d;
      --panel-2: #101126;
      --text: #f8f6f2;
      --muted: #b7bdd6;
      --line: rgba(255,255,255,.16);
      --line-strong: rgba(255,255,255,.27);
      --orange: #d47d54;
      --green: #64e4f4;
      --white: #121327;
      --danger: #ff7d85;
      --shadow-cyan: rgba(100,228,244,.14);
      --shadow-violet: rgba(159,131,255,.15);
      --shadow-copper: rgba(212,125,84,.16);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 8%,rgba(100,228,244,.14),transparent 28%),
        radial-gradient(circle at 82% 20%,rgba(159,131,255,.2),transparent 30%),
        var(--night);
      font-family: Manrope, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    h1, h2, h3, h4 { font-family: Fraunces, Georgia, serif; margin: 0; }
    a { text-decoration: none; color: inherit; }
    button { font: inherit; cursor: pointer; border: none; outline: none; -webkit-tap-highlight-color: transparent; }

    /* Header (Aurora Theme) */
    .site-header {
      position: sticky; top: 18px; z-index: 50;
      width: min(1400px,calc(100% - 34px));
      margin: 0 auto 18px;
      background: rgba(10,10,25,.84);
      border: 1px solid var(--line);
      border-radius: 22px 22px 65px 65px;
      box-shadow: 0 22px 70px rgba(0,0,0,.42);
      backdrop-filter: blur(28px);
    }
    .header-inner { min-height: 90px; padding: 14px 25px; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-mark {
      width: 54px; height: 54px; display: grid; place-items: center;
      color: var(--night); background: linear-gradient(145deg,var(--cyan),var(--violet) 58%,var(--copper));
      border-radius: 50% 50% 12px 12px; box-shadow: 0 0 30px rgba(100,228,244,.3);
      font: italic 400 21px/1 "Instrument Serif",Georgia,serif; transform: rotate(-3deg);
    }
    .brand-copy b { display: block; color: #fff; font: italic 400 31px/1 "Instrument Serif",Georgia,serif; letter-spacing: -.025em; text-shadow: 0 0 24px rgba(100,228,244,.18); }
    .brand-copy small { display: block; color: #8f97b8; font-size: 8px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }

    /* Main Workspace Container */
    .workspace {
      width: min(1400px, calc(100% - 34px));
      margin: 40px auto 80px;
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 24px;
      align-items: stretch;
    }

    /* Left Panel: Settings */
    .settings-panel {
      background: linear-gradient(145deg,rgba(18,20,43,.94),rgba(9,10,24,.96));
      border: 1px solid var(--line);
      border-radius: 30px;
      padding: 30px;
      box-shadow: 14px 16px 0 var(--shadow-cyan),0 28px 60px rgba(0,0,0,.24);
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .panel-section-title {
      color: var(--cyan);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .panel-section-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }

    /* Platform Selectors */
    .platform-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .platform-btn {
      padding: 10px 16px;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      transition: all 0.2s ease;
    }
    .platform-btn:hover { color: var(--cyan); border-color: var(--cyan); background: rgba(100,228,244,.07); }
    .platform-btn.active { color: #fff; border-color: var(--cyan); background: linear-gradient(110deg,rgba(100,228,244,.15),rgba(159,131,255,.15)); box-shadow: 0 0 12px rgba(100,228,244,.15); }

    /* Resolutions/Modes Grid */
    .resolution-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .res-btn {
      padding: 14px 12px;
      background: rgba(255,255,255,.02);
      border: 1px solid var(--line);
      border-radius: 14px;
      text-align: left;
      color: var(--muted);
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .res-btn b { font-size: 12px; color: var(--text); }
    .res-btn small { font-size: 10px; color: var(--violet); font-weight: 700; }
    .res-btn:hover { border-color: var(--violet); background: rgba(159,131,255,.05); }
    .res-btn.active { border-color: var(--violet); background: rgba(159,131,255,.15); box-shadow: inset 0 -4px 0 var(--violet); }
    .res-btn.active b { color: #fff; }

    /* Toggle Groups (Fit, Fill, Stretch, Blur) */
    .toggle-group {
      display: flex;
      background: rgba(255,255,255,.03);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      padding: 4px;
    }
    .toggle-btn {
      flex: 1;
      padding: 12px;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      border-radius: 10px;
      transition: all 0.2s ease;
    }
    .toggle-btn:hover { color: #fff; }
    .toggle-btn.active { background: rgba(255,255,255,.1); color: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.2); }

    .hardware-btn {
      width: 100%;
      padding: 18px;
      margin-top: auto;
      background: linear-gradient(110deg,var(--cyan),var(--violet));
      color: var(--night);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.05em;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(100,228,244,.3);
      transition: transform 0.1s ease;
    }
    .hardware-btn:active { transform: translateY(2px); }
    .hardware-btn:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }

    /* Right Panel: Preview Stage */
    .stage-panel {
      position: relative;
      background: linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px), linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px), #0c0e20;
      background-size: 30px 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      box-shadow: 14px 16px 0 var(--shadow-violet),0 28px 60px rgba(0,0,0,.24);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      min-height: 600px;
    }

    /* Dropzone State */
    .dropzone {
      position: absolute; inset: 20px;
      border: 2px dashed var(--line-strong);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      z-index: 10;
      background: rgba(12,14,32,0.6);
      backdrop-filter: blur(4px);
    }
    .dropzone:hover, .dropzone.is-over { border-color: var(--cyan); background: rgba(100,228,244,.05); }
    .drop-symbol {
      width: 72px; height: 72px; display: grid; place-items: center;
      background: var(--paper); color: var(--copper);
      border-radius: 50% 50% 12px 12px; box-shadow: 7px 8px 0 rgba(100,228,244,.26);
      font-size: 28px; font-weight: 900; margin-bottom: 20px;
    }
    .dropzone h3 { font-size: 24px; color: #fff; margin-bottom: 8px; }
    .dropzone p { color: var(--muted); font-size: 13px; }
    .file-input { display: none; }

    /* Live Image Preview */
    .preview-container {
      position: relative;
      width: 90%;
      height: 90%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      display: none; /* Hidden until upload */
    }
    .preview-container.has-image { display: flex; }
    
    .canvas-wrapper {
      position: relative;
      box-shadow: 0 20px 50px rgba(0,0,0,.5);
      transition: all 0.3s ease;
    }
    
    /* Result Ticket Overlay */
    .result-overlay {
      position: absolute;
      top: 24px; right: 24px;
      background: rgba(10,10,25,.9);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 20;
      display: none;
      min-width: 200px;
    }
    .result-overlay.visible { display: block; }
    .result-overlay small { color: var(--cyan); font-size: 9px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; display: block; margin-bottom: 8px; }
    .result-overlay b { color: #fff; font-size: 16px; display: block; margin-bottom: 4px; }
    .result-overlay p { color: var(--muted); font-size: 11px; margin: 0 0 14px 0; }
    
    .action-row { display: flex; gap: 8px; }
    .action-btn { flex: 1; padding: 10px; border-radius: 10px; font-size: 11px; font-weight: 700; text-align: center; }
    .btn-download { background: var(--copper); color: #fff; box-shadow: 0 4px 15px rgba(212,125,84,.3); }
    .btn-reset { background: rgba(255,255,255,.05); color: #fff; border: 1px solid var(--line); }

    /* Active indicator for target preview */
    .target-badge {
      position: absolute;
      bottom: 24px; left: 24px;
      background: rgba(159,131,255,.15);
      border: 1px solid var(--violet);
      color: #fff;
      padding: 10px 16px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 700;
      backdrop-filter: blur(10px);
      z-index: 20;
      display: none;
    }
    .target-badge.visible { display: block; }

    @media (max-width: 960px) {
      .workspace { grid-template-columns: 1fr; }
      .stage-panel { min-height: 400px; order: -1; } /* Stage on top on mobile */
      .site-header { width: calc(100% - 20px); border-radius: 18px; top: 10px; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#">
        <span class="brand-mark">15</span>
        <span class="brand-copy"><b>ImageReducer</b><small>Aurora Social Resizer</small></span>
      </a>
    </div>
  </header>

  <!-- Main App Workspace -->
  <main class="workspace">
    
    <!-- Left: Control Panel -->
    <aside class="settings-panel">
      
      <div>
        <div class="panel-section-title">01 // Select Platform</div>
        <div class="platform-list" id="platformList">
          <!-- Populated by JS -->
        </div>
      </div>

      <div>
        <div class="panel-section-title">02 // Target Resolution</div>
        <div class="resolution-grid" id="resolutionGrid">
          <!-- Populated by JS -->
        </div>
      </div>

      <div>
        <div class="panel-section-title">03 // Resize Type</div>
        <div class="toggle-group" id="resizeTypeGroup">
          <button class="toggle-btn active" data-type="fit">FIT (Pad)</button>
          <button class="toggle-btn" data-type="fill">FILL (Crop)</button>
          <button class="toggle-btn" data-type="stretch">STRETCH</button>
        </div>
      </div>

      <div id="backgroundSettings">
        <div class="panel-section-title">04 // Background Fill</div>
        <div class="toggle-group" id="bgTypeGroup">
          <button class="toggle-btn active" data-bg="color">COLOR</button>
          <button class="toggle-btn" data-bg="blur">BLUR</button>
        </div>
      </div>

      <button class="hardware-btn" id="btnResize" disabled>RESIZE IMAGE TO POST</button>
    </aside>

    <!-- Right: Preview Stage -->
    <section class="stage-panel">
      
      <!-- Uploader State -->
      <label class="dropzone" id="dropzone" for="fileInput">
        <span class="drop-symbol">↑</span>
        <h3>Drop your image here</h3>
        <p>Or click to securely upload<br>JPG, PNG, WebP supported</p>
      </label>
      <input class="file-input" id="fileInput" type="file" accept="image/jpeg, image/png, image/webp">

      <!-- Interactive Preview State -->
      <div class="preview-container" id="previewContainer">
        <div class="canvas-wrapper" id="canvasWrapper">
          <canvas id="liveCanvas"></canvas>
        </div>
      </div>

      <!-- Overlays -->
      <div class="target-badge" id="targetBadge">Target: 1080 x 1080 (1:1)</div>
      
      <div class="result-overlay" id="resultOverlay">
        <small>CONVERSION COMPLETE</small>
        <b id="resultTitle">Instagram Post</b>
        <p id="resultDetails">1080 × 1080 px • Fit • Blur</p>
        <div class="action-row">
          <button class="action-btn btn-reset" id="btnReset">NEW IMAGE</button>
          <button class="action-btn btn-download" id="btnDownload">DOWNLOAD ↓</button>
        </div>
      </div>

    </section>

  </main>

  <script>
    // --- Data Model based on User's Screenshots ---
    const socialData = {
      Instagram: [
        { label: "Profile Picture", ratio: "1:1", width: 320, height: 320 },
        { label: "Post (square)", ratio: "1:1", width: 1080, height: 1080 },
        { label: "Post (portrait)", ratio: "4:5", width: 1080, height: 1350 },
        { label: "Post (landscape)", ratio: "1.91:1", width: 1080, height: 566 },
        { label: "Story", ratio: "9:16", width: 1080, height: 1920 },
        { label: "Reels", ratio: "9:16", width: 1080, height: 1920 },
        { label: "Reels Cover", ratio: "9:16", width: 1080, height: 1920 }
      ],
      Facebook: [
        { label: "Profile Photo", ratio: "1:1", width: 176, height: 176 },
        { label: "Post Square", ratio: "1:1", width: 1200, height: 1200 },
        { label: "Stories", ratio: "9:16", width: 1080, height: 1920 },
        { label: "Reels", ratio: "9:16", width: 1080, height: 1920 },
        { label: "Group Cover Image", ratio: "16:9", width: 1640, height: 856 },
        { label: "Cover Event Image", ratio: "1.92:1", width: 1200, height: 628 }
      ],
      YouTube: [
        { label: "Profile Photo", ratio: "1:1", width: 800, height: 800 },
        { label: "Thumbnail", ratio: "16:9", width: 1280, height: 720 },
        { label: "Banner", ratio: "16:9", width: 2560, height: 1440 }
      ],
      X: [
        { label: "Profile Picture", ratio: "1:1", width: 400, height: 400 },
        { label: "Header Picture", ratio: "16:9", width: 1500, height: 500 }
      ],
      LinkedIn: [
        { label: "Profile Photo", ratio: "1:1", width: 400, height: 400 },
        { label: "Background Photo", ratio: "4:1", width: 1584, height: 396 },
        { label: "Company Logo", ratio: "1:1", width: 300, height: 300 },
        { label: "Company Cover", ratio: "5.91:1", width: 1128, height: 191 }
      ],
      Pinterest: [
        { label: "Square Pin", ratio: "1:1", width: 1000, height: 1000 },
        { label: "Standard Pin", ratio: "2:3", width: 1000, height: 1500 },
        { label: "Vertical Pin", ratio: "9:16", width: 1000, height: 1778 }
      ],
      TikTok: [
        { label: "Profile Picture", ratio: "1:1", width: 200, height: 200 },
        { label: "In-feed Ad", ratio: "1:1", width: 1080, height: 1080 }
      ],
      Tumblr: [
        { label: "Profile Picture", ratio: "1:1", width: 128, height: 128 },
        { label: "Header Picture", ratio: "16:9", width: 3000, height: 1055 }
      ],
      Snapchat: [
        { label: "Image Share", ratio: "9:16", width: 1080, height: 1920 }
      ],
      Vinted: [
        { label: "Profile Picture", ratio: "1:1", width: 300, height: 300 },
        { label: "Item Photo", ratio: "2:3", width: 800, height: 1200 }
      ],
      Email: [
        { label: "Blog Featured 1", ratio: "3:1", width: 600, height: 200 },
        { label: "Blog Image", ratio: "1:1", width: 600, height: 600 },
        { label: "Blog Featured 2", ratio: "2:1", width: 600, height: 300 }
      ]
    };

    // --- State Management ---
    const state = {
      platform: 'Instagram',
      modeIndex: 1, // Default: Post (square)
      resizeType: 'fit', // fit, fill, stretch
      bgType: 'color', // color, blur
      imageObj: null,
      fileName: 'resized_image',
      resultBlob: null
    };

    // --- DOM Elements ---
    const platformList = document.getElementById('platformList');
    const resolutionGrid = document.getElementById('resolutionGrid');
    const bgSettingsGroup = document.getElementById('backgroundSettings');
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const previewContainer = document.getElementById('previewContainer');
    const liveCanvas = document.getElementById('liveCanvas');
    const canvasCtx = liveCanvas.getContext('2d');
    const canvasWrapper = document.getElementById('canvasWrapper');
    const targetBadge = document.getElementById('targetBadge');
    const btnResize = document.getElementById('btnResize');
    const resultOverlay = document.getElementById('resultOverlay');

    // --- Initialization & UI Building ---
    function init() {
      buildPlatforms();
      buildResolutions();
      bindEvents();
      updateExecuteButton();
    }

    function buildPlatforms() {
      platformList.innerHTML = '';
      Object.keys(socialData).forEach(platform => {
        const btn = document.createElement('button');
        btn.className = `platform-btn ${platform === state.platform ? 'active' : ''}`;
        btn.textContent = platform;
        btn.onclick = () => {
          state.platform = platform;
          state.modeIndex = 0; // Reset mode on platform change
          buildPlatforms();
          buildResolutions();
          updateLivePreview();
        };
        platformList.appendChild(btn);
      });
    }

    function buildResolutions() {
      resolutionGrid.innerHTML = '';
      const modes = socialData[state.platform];
      modes.forEach((mode, idx) => {
        const btn = document.createElement('button');
        btn.className = `res-btn ${idx === state.modeIndex ? 'active' : ''}`;
        btn.innerHTML = `<b>${mode.label}</b><small>RATIO ${mode.ratio}</small>`;
        btn.onclick = () => {
          state.modeIndex = idx;
          buildResolutions();
          updateLivePreview();
        };
        resolutionGrid.appendChild(btn);
      });
      updateExecuteButton();
    }

    function bindEvents() {
      // Resize Type Toggles
      document.querySelectorAll('#resizeTypeGroup .toggle-btn').forEach(btn => {
        btn.onclick = (e) => {
          document.querySelectorAll('#resizeTypeGroup .toggle-btn').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          state.resizeType = e.target.dataset.type;
          
          // Toggle visibility of Background settings (only needed for Fit)
          bgSettingsGroup.style.display = state.resizeType === 'fit' ? 'block' : 'none';
          
          updateLivePreview();
        };
      });

      // Background Fill Toggles
      document.querySelectorAll('#bgTypeGroup .toggle-btn').forEach(btn => {
        btn.onclick = (e) => {
          document.querySelectorAll('#bgTypeGroup .toggle-btn').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          state.bgType = e.target.dataset.bg;
          updateLivePreview();
        };
      });

      // File Upload Events
      dropzone.addEventListener('click', () => fileInput.click());
      
      ['dragenter', 'dragover'].forEach(evt => {
        dropzone.addEventListener(evt, (e) => {
          e.preventDefault();
          dropzone.classList.add('is-over');
        });
      });
      
      ['dragleave', 'drop'].forEach(evt => {
        dropzone.addEventListener(evt, (e) => {
          e.preventDefault();
          dropzone.classList.remove('is-over');
        });
      });
      
      dropzone.addEventListener('drop', (e) => {
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          handleFile(e.dataTransfer.files[0]);
        }
      });
      
      fileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
          handleFile(e.target.files[0]);
        }
      });

      // Actions
      btnResize.addEventListener('click', performResize);
      document.getElementById('btnReset').addEventListener('click', resetApp);
      document.getElementById('btnDownload').addEventListener('click', downloadResult);
    }

    function updateExecuteButton() {
      const mode = socialData[state.platform][state.modeIndex];
      btnResize.textContent = `RESIZE TO ${mode.label.toUpperCase()}`;
    }

    // --- Image Handling & Canvas Rendering ---
    function handleFile(file) {
      if (!file.type.match('image.*')) return alert('Please upload an image file.');
      
      state.fileName = file.name.split('.')[0] + '_resized';
      
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          state.imageObj = img;
          dropzone.style.display = 'none';
          previewContainer.classList.add('has-image');
          targetBadge.classList.add('visible');
          btnResize.disabled = false;
          updateLivePreview();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function updateLivePreview() {
      if (!state.imageObj) return;

      const mode = socialData[state.platform][state.modeIndex];
      const targetW = mode.width;
      const targetH = mode.height;

      // Update badge
      targetBadge.textContent = `Target: ${targetW} × ${targetH} (${mode.ratio})`;

      // Set canvas internal resolution to target for accurate processing
      liveCanvas.width = targetW;
      liveCanvas.height = targetH;
      
      // Calculate responsive preview display size
      const maxDisplaySize = 480; 
      let displayW = targetW;
      let displayH = targetH;
      
      if (displayW > maxDisplaySize || displayH > maxDisplaySize) {
        const scale = Math.min(maxDisplaySize / displayW, maxDisplaySize / displayH);
        displayW *= scale;
        displayH *= scale;
      }
      
      liveCanvas.style.width = `${displayW}px`;
      liveCanvas.style.height = `${displayH}px`;

      // Clear Canvas
      canvasCtx.clearRect(0, 0, targetW, targetH);

      // Rendering Logic based on Resize Type
      const img = state.imageObj;
      const srcW = img.width;
      const srcH = img.height;
      const ratioSrc = srcW / srcH;
      const ratioTarget = targetW / targetH;

      if (state.resizeType === 'stretch') {
        canvasCtx.drawImage(img, 0, 0, targetW, targetH);
      } 
      else if (state.resizeType === 'fill') {
        // Crop to fill
        let renderW, renderH, offsetX = 0, offsetY = 0;
        if (ratioSrc > ratioTarget) {
          // Source is wider, crop sides
          renderH = targetH;
          renderW = srcW * (targetH / srcH);
          offsetX = (targetW - renderW) / 2;
        } else {
          // Source is taller, crop top/bottom
          renderW = targetW;
          renderH = srcH * (targetW / srcW);
          offsetY = (targetH - renderH) / 2;
        }
        canvasCtx.drawImage(img, offsetX, offsetY, renderW, renderH);
      } 
      else if (state.resizeType === 'fit') {
        // Pad to fit
        let renderW, renderH, offsetX = 0, offsetY = 0;
        if (ratioSrc > ratioTarget) {
          // Source is wider, pad top/bottom
          renderW = targetW;
          renderH = srcH * (targetW / srcW);
          offsetY = (targetH - renderH) / 2;
        } else {
          // Source is taller, pad sides
          renderH = targetH;
          renderW = srcW * (targetH / srcH);
          offsetX = (targetW - renderW) / 2;
        }

        // Draw Background
        if (state.bgType === 'color') {
          // Use a dark background matching the theme
          canvasCtx.fillStyle = '#080814';
          canvasCtx.fillRect(0, 0, targetW, targetH);
        } else if (state.bgType === 'blur') {
          canvasCtx.save();
          canvasCtx.filter = 'blur(20px) brightness(0.6)';
          // Stretch image behind for blurred background
          canvasCtx.drawImage(img, -10, -10, targetW + 20, targetH + 20); 
          canvasCtx.restore();
        }

        // Draw image on top
        canvasCtx.drawImage(img, offsetX, offsetY, renderW, renderH);
      }
    }

    // --- Actions ---
    function performResize() {
      // Trigger a visual confirmation (simulate backend processing)
      btnResize.textContent = "PROCESSING...";
      btnResize.disabled = true;
      
      setTimeout(() => {
        const mode = socialData[state.platform][state.modeIndex];
        
        document.getElementById('resultTitle').textContent = `${state.platform} ${mode.label}`;
        document.getElementById('resultDetails').textContent = `${mode.width} × ${mode.height} px • ${state.resizeType.toUpperCase()} • ${state.resizeType === 'fit' ? state.bgType.toUpperCase() : ''}`;
        
        liveCanvas.toBlob((blob) => {
          state.resultBlob = blob;
          resultOverlay.classList.add('visible');
          btnResize.textContent = "DONE";
        }, 'image/jpeg', 0.95);
      }, 600);
    }

    function downloadResult() {
      if (!state.resultBlob) return;
      const url = URL.createObjectURL(state.resultBlob);
      const link = document.createElement('a');
      link.href = url;
      
      const mode = socialData[state.platform][state.modeIndex];
      link.download = `${state.fileName}_${state.platform}_${mode.ratio.replace(':','x')}.jpg`;
      
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function resetApp() {
      state.imageObj = null;
      state.resultBlob = null;
      fileInput.value = '';
      
      dropzone.style.display = 'flex';
      previewContainer.classList.remove('has-image');
      targetBadge.classList.remove('visible');
      resultOverlay.classList.remove('visible');
      btnResize.disabled = true;
      updateExecuteButton();
    }

    // Initialize App
    init();
  </script>
</body>
