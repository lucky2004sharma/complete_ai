    <!-- New Font: Orbitron for futuristic Sci-Fi look -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { mono: ['"Orbitron"', 'monospace'] },
                    colors: { indBg: '#0F0F1B', indPanel: '#1A1A2E', indText: '#00F0FF', indOrange: '#FCEE09', indGreen: '#FF003C', white: '#111122' },
                    // Overriding sizes: Sharp, thin glowing borders
                    borderWidth: { DEFAULT: '1px', '2': '1px', '4': '2px' },
                    borderRadius: { DEFAULT: '0px', sm: '0px', md: '0px', lg: '0px' }
                }
            }
        }
    </script>
    <style>
        /* Cyberpunk CSS Geometry & Glowing Neons */
        body { background-color: #0F0F1B; color: #00F0FF; text-shadow: 0 0 5px rgba(0, 240, 255, 0.5); }
        
        * { border-color: #00F0FF !important; }
        
        /* The Magic: Angled Corner Cuts using Clip Path */
        .bg-white, .bg-indPanel, header {
            background-color: rgba(17, 17, 34, 0.8) !important;
            border: 1px solid #00F0FF !important;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2), inset 0 0 10px rgba(0, 240, 255, 0.1) !important;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%);
        }
        
        .hardware-btn {
            background-color: #FCEE09 !important; color: #000 !important; font-weight: 900 !important;
            border: none !important; box-shadow: 0 0 20px rgba(252, 238, 9, 0.5) !important; text-shadow: none;
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
        }
        .hardware-btn:hover { background-color: #FF003C !important; color: #FFF !important; box-shadow: 0 0 20px rgba(255, 0, 60, 0.8) !important; }
        
        .dropdown-menu { display: none; position: absolute; top: 100%; left: 0; min-width: 240px; z-index: 100; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%); background: #111122 !important; border: 1px solid #FF003C !important; }
        .dropdown-container:hover .dropdown-menu { display: block; }
    </style>
</head>
